name: Check announcement rebase

on:
  push:
    branches:
      - announce-mobile-pr

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run required checks
        shell: cmd
        run: gradlew.bat detektAll testAndroidHostTest :androidApp:testDebug
